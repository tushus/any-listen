name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-alpine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=alpine
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}

      - name: Get commit date
        id: commit
        run: echo "date=$(git log -1 --format=%cI ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: Build and push (Alpine)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IS_CI=true
            GIT_COMMIT_ID=${{ github.sha }}
            GIT_COMMIT_DATE=${{ steps.commit.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-lts-slim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=lts-slim
            type=semver,pattern={{version}},suffix=-lts-slim
            type=semver,pattern={{major}},suffix=-lts-slim

      - name: Get commit date
        id: commit
        run: echo "date=$(git log -1 --format=%cI ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: Build and push (LTS Slim)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lts-slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IS_CI=true
            GIT_COMMIT_ID=${{ github.sha }}
            GIT_COMMIT_DATE=${{ steps.commit.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
